name: Bots
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bot: [serverbot, chatbot, workbot]
    defaults:
      run:
        working-directory: apps/bots/${{ matrix.bot }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - run: uv run --locked bot --help
      - run: uv run --locked pytest
      - run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > /tmp/runtime.txt
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps -r /tmp/runtime.txt
