[project]
name = "workbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.14.3",
    "soupsieve==3.0.4",
    "typing-extensions==4.16.0",
]

[project.scripts]
bot = "workbot.__main__:main"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
