[project]
name = "serverbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.0,<4",
    "tzdata>=2025.2",
    "aiohttp>=3.12.0,<4",
    "aiogram>=3.31.0",
    "aiohttp-socks>=0.12.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
bot = "serverbot.main:cli"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
