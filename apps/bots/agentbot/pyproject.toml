[project]
name = "agentbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiogram==3.31.0", "aiohttp>=3.13.3,<4", "aiohttp-socks>=0.12,<1", "python-dotenv>=1.2.4,<2"]

[project.scripts]
bot = "agentbot.main:cli"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
