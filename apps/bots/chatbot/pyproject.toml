[project]
name = "chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "aiohttp-socks==0.11.0",
    "certifi==2026.10.23",
    "python-dotenv==1.2.2",
]

[project.scripts]
bot = "chatbot.main:cli"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
