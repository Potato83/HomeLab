# Reference only: production is managed by OpenRC + Podman.
services:
  omniroute:
    image: docker.io/diegosouzapw/omniroute@sha256:90f903d7e9245973dc23f7f0a3afc0c63502c9bd25961097843361689df6474b
    container_name: omniroute
    restart: on-failure:5
    network_mode: host
    stop_grace_period: 40s
    env_file: .env
    environment:
      DATA_DIR: /app/data
      PORT: '20127'
      API_PORT: '20127'
      DASHBOARD_PORT: '20127'
      API_HOST: 127.0.0.1
      OMNIROUTE_HOSTNAME: 127.0.0.1
      HTTP_PROXY: http://127.0.0.1:2080
      HTTPS_PROXY: http://127.0.0.1:2080
      ALL_PROXY: socks5://127.0.0.1:2080
      NO_PROXY: localhost,127.0.0.1
      REQUIRE_API_KEY: 'true'
      OMNIROUTE_MEMORY_MB: '1536'
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - ./data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 128
